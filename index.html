<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深坑麻將戰績紀錄</title>
    <!-- 引入 Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 ECharts 與 ECharts GL -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #070B19;       
            --bg-card: #131B2F;       
            --lime-green: #D9FF00;    
            --lime-hover: #bceb00;
            --cyan-glow: #00E5FF;
            --text-light: #F8FAFC;
            --text-muted: #94A3B8;
            --win-color: #FF4D4F;     
            --lose-color: #9CA3AF;    
            --border-color: #1E293B;  
        }

        body { 
            background-color: var(--bg-dark); color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; 
        }

        .navbar { background-color: var(--bg-dark) !important; border-bottom: 1px solid var(--border-color); }
        .navbar-brand { font-weight: bold; color: var(--text-light) !important; }
        
        .btn-lime { background-color: var(--lime-green); color: #000; font-weight: bold; border: none; }
        .btn-lime:hover { background-color: var(--lime-hover); color: #000; }
        .btn-outline-lime { border: 1px solid var(--lime-green); color: var(--lime-green); background: transparent; }
        .btn-outline-lime:hover { background-color: var(--lime-green); color: #000; }
        
        .btn-outline-cyan { border: 1px solid var(--cyan-glow); color: var(--cyan-glow); background: transparent; }
        .btn-outline-cyan:hover { background-color: var(--cyan-glow); color: #000; }

        .card { background-color: var(--bg-card); border: 1px solid var(--border-color); }
        .modal-content { background-color: var(--bg-card); color: var(--text-light); border: 1px solid var(--lime-green); }
        .modal-header { border-bottom: 1px solid var(--border-color); }
        .modal-footer { border-top: 1px solid var(--border-color); }
        .form-control, .form-select { background-color: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-light); }
        .form-control:focus, .form-select:focus { background-color: var(--bg-dark); color: var(--text-light); border-color: var(--lime-green); box-shadow: 0 0 0 0.25rem rgba(217, 255, 0, 0.25); }

        .win-text { color: var(--win-color) !important; font-weight: bold; } 
        .lose-text { color: var(--lose-color) !important; } 
        
        .nav-tabs { border-bottom: 1px solid var(--border-color); }
        .nav-tabs .nav-link { color: var(--text-muted); font-weight: 500; border: none; }
        .nav-tabs .nav-link:hover { color: var(--text-light); }
        .nav-tabs .nav-link.active { background-color: transparent !important; color: var(--lime-green) !important; border-bottom: 3px solid var(--lime-green) !important; font-weight: bold; }

        .table-container { height: calc(100vh - 180px); overflow-x: auto; overflow-y: auto; }
        table { color: var(--text-light) !important; white-space: nowrap; border-collapse: separate; border-spacing: 0; }
        .table-bordered > :not(caption) > * > * { border-color: var(--border-color); }

        #historyTable th, #historyTable td { color: var(--text-light) !important; }
        #historyTable thead tr:nth-child(1) th { position: sticky; top: 0; background-color: var(--bg-dark) !important; z-index: 3; border-bottom: 2px solid var(--lime-green); }
        #historyTable thead tr:nth-child(2) th { position: sticky; top: 41px; background-color: #0B1120 !important; z-index: 3; font-size: 0.95rem; }
        #historyTable th:nth-child(1), #historyTable td:nth-child(1) { position: sticky; left: 0; z-index: 2; }
        #historyTable th:nth-child(2), #historyTable td:nth-child(2) { position: sticky; left: 60px; z-index: 2; box-shadow: 3px 0 10px rgba(0,0,0,0.8); }
        #historyTable thead tr:nth-child(1) th:nth-child(1), #historyTable thead tr:nth-child(1) th:nth-child(2) { z-index: 5; }
        #historyTable thead tr:nth-child(2) th:nth-child(1) { position: sticky; left: 0; z-index: 5; box-shadow: 3px 0 10px rgba(0,0,0,0.8); }

        #historyTable tbody tr:nth-of-type(odd) td { background-color: var(--bg-card) !important; }
        #historyTable tbody tr:nth-of-type(even) td { background-color: var(--bg-dark) !important; }
        #historyTable tbody tr:hover td { background-color: #1e293b !important; }

        .leaderboard-container { height: calc(100vh - 180px); overflow-y: auto; }
        .leaderboard-container thead th { position: sticky; top: 0; background-color: var(--bg-dark) !important; z-index: 2; border-bottom: 2px solid var(--lime-green); color: var(--text-light) !important; }
        .leaderboard-container tbody tr:nth-of-type(odd) td { background-color: var(--bg-card) !important; color: var(--text-light) !important; }
        .leaderboard-container tbody tr:nth-of-type(even) td { background-color: var(--bg-dark) !important; color: var(--text-light) !important; }
        .sortable { cursor: pointer; user-select: none; }
        .sortable:hover { color: var(--lime-green) !important; }

        .chart-container { position: relative; height: calc(100vh - 270px); width: 100%; }
        .spinner-border { color: var(--lime-green) !important; }
    </style>
</head>
<body>

<nav class="navbar shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">🀄 好友麻將戰績系統</span>
        <button class="btn btn-lime btn-sm" onclick="showLoginModal()">➕ 新增紀錄</button>
    </div>
</nav>

<div class="container mt-3">
    <div id="loading" class="text-center my-5">
        <div class="spinner-border" role="status"></div>
        <p class="mt-2 text-muted">正在載入雲端數據庫...</p>
    </div>

    <div id="mainContent" style="display: none;">
        <ul class="nav nav-tabs mb-3" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="history-tab" data-bs-toggle="tab" data-bs-target="#history" type="button" role="tab">📝 歷史紀錄</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="chart-tab" data-bs-toggle="tab" data-bs-target="#chart" type="button" role="tab">📈 走勢圖</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="leaderboard-tab" data-bs-toggle="tab" data-bs-target="#leaderboard" type="button" role="tab">🏆 勝率榜</button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <!-- 歷史紀錄 -->
            <div class="tab-pane fade show active" id="history" role="tabpanel">
                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-container" id="historyTableContainer">
                            <table class="table table-bordered mb-0 text-center" id="historyTable"></table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 走勢圖 -->
            <div class="tab-pane fade" id="chart" role="tabpanel">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                            <p class="text-muted small mb-0">💡 點擊圖例開關玩家(系統會記憶)。</p>
                            <div class="d-flex gap-2 align-items-center flex-wrap">
                                <button class="btn btn-outline-cyan btn-sm text-nowrap" id="playAnimBtn" onclick="renderChart(true)">▶️ 播放動畫</button>
                                <select id="xAxisInterval" class="form-select form-select-sm" style="width: auto; background-color: var(--bg-dark); color: var(--lime-green); border-color: var(--lime-green);" onchange="renderChart(false)">
                                    <option value="auto">X軸間距: 自動</option>
                                    <option value="0">顯示每 1 局</option>
                                    <option value="1">顯示每 2 局</option>
                                    <option value="2">顯示每 3 局</option>
                                    <option value="3">顯示每 4 局</option>
                                    <option value="4">顯示每 5 局</option>
                                    <option value="5">顯示每 6 局</option>
                                    <option value="6">顯示每 7 局</option>
                                    <option value="7">顯示每 8 局</option>
                                    <option value="8">顯示每 9 局</option>
                                    <option value="9">顯示每 10 局</option>
                                </select>
                                <button class="btn btn-outline-lime btn-sm text-nowrap" id="toggleChartBtn" onclick="toggleChartMode()">切換為 3D 視角</button>
                            </div>
                        </div>
                        <div class="chart-container" id="myChart"></div>
                    </div>
                </div>
            </div>

            <!-- 勝率榜 -->
            <div class="tab-pane fade" id="leaderboard" role="tabpanel">
                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <div class="leaderboard-container">
                            <table class="table text-center mb-0">
                                <thead>
                                    <tr>
                                        <th>排名</th>
                                        <th>玩家</th>
                                        <th class="sortable" onclick="sortLeaderboard('rate')">勝率 ▼</th>
                                        <th class="sortable" onclick="sortLeaderboard('amount')">累計金額 ▼</th>
                                        <th class="sortable" onclick="sortLeaderboard('games')">局數 ▼</th>
                                        <th class="sortable" onclick="sortLeaderboard('wins')">勝局 ▼</th>
                                        <th class="sortable" onclick="sortLeaderboard('loses')">輸局 ▼</th>
                                    </tr>
                                </thead>
                                <tbody id="leaderboardTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 登入與新增 Modal (結構維持不變) -->
<div class="modal fade" id="loginModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" style="color: var(--lime-green)">管理員權限驗證</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label text-muted">帳號</label>
                    <input type="text" class="form-control" id="loginAccount" placeholder="請輸入帳號">
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">密碼 (若無設定可留白)</label>
                    <input type="password" class="form-control" id="loginPassword" placeholder="請輸入密碼">
                </div>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-lime w-100" onclick="doLogin()">登入</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addRecordModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" style="color: var(--lime-green)">➕ 寫入對戰紀錄</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row mb-3">
                    <div class="col-6"><label class="form-label text-muted">日期</label><input type="date" class="form-control" id="recordDate"></div>
                    <div class="col-6"><label class="form-label text-muted">備註</label><input type="text" class="form-control" id="recordMemo" placeholder="例如：打300/100"></div>
                </div>
                <hr style="border-color: var(--border-color);">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="mb-0 text-light">參賽人員與金額 (總和須為0)</h6>
                    <button class="btn btn-sm btn-outline-lime" onclick="addPlayerInputRow()">+ 新增人員</button>
                </div>
                <div id="playerInputsContainer"></div>
                <div class="text-end mt-3 fw-bold fs-5">目前總和：<span id="currentSum" class="text-light">0</span></div>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-lime" onclick="submitRecord()">確認送出</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyaqTfTnxfAQuaiUi8UhkvgWjmLz6_U9mzKp0kp3PNzNzBEKwuB69sC6hnJhlN8QLWx/exec";
    
    let allData = { players: [], records: [] };
    let playerStats = {};
    let sortedPlayers = [];
    let availablePlayersForDropdown = [];
    let currentSortBy = 'rate';
    
    let myChart = null;
    let is3DMode = false;
    let chartLegendState = {}; 
    let animInterval = null; 
    let hasPlayedInitialAnim = false; 

    const colorPalette = ['#D9FF00', '#00E5FF', '#FF0055', '#FFaa00', '#00ff88', '#B700FF', '#FF00CC', '#0088FF', '#FFff00', '#FF3300'];

    window.onload = () => {
        document.getElementById('recordDate').valueAsDate = new Date();
        fetchData();
        
        setTimeout(() => {
            let firstTh = document.querySelector('#historyTable thead tr:nth-child(1) th');
            if(firstTh) {
                let h = firstTh.offsetHeight;
                let css = document.createElement('style');
                css.innerHTML = `#historyTable thead tr:nth-child(2) th { top: ${h-1}px; }`;
                document.head.appendChild(css);
            }
        }, 1000);
        
        window.addEventListener('resize', () => { if(myChart) myChart.resize(); });
        
        document.getElementById('chart-tab').addEventListener('shown.bs.tab', function (e) {
            if (!hasPlayedInitialAnim) {
                hasPlayedInitialAnim = true;
                renderChart(true); 
            } else if(myChart) myChart.resize();
        });
    };

    async function fetchData() {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('mainContent').style.display = 'none';
        try {
            let res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getData' }) });
            let result = await res.json();
            if(result.data) {
                allData = result.data;
                availablePlayersForDropdown = [...allData.players];
                processData();
            }
        } catch (error) { alert("資料載入失敗，請檢查網路連線。"); }
        document.getElementById('loading').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
    }

    function processData() {
        playerStats = {};
        allData.players.forEach(p => { playerStats[p] = { games: 0, wins: 0, loses: 0, totalAmount: 0, historySum: [0] }; });
        let sortedRecords = [...allData.records].sort((a,b) => a.id - b.id);
        sortedRecords.forEach(record => {
            allData.players.forEach(p => {
                let score = record.scores[p];
                let lastSum = playerStats[p].historySum[playerStats[p].historySum.length - 1];
                if (score !== null && score !== "") {
                    let numScore = Number(score);
                    playerStats[p].games += 1;
                    if (numScore >= 0) playerStats[p].wins += 1; else playerStats[p].loses += 1;
                    playerStats[p].totalAmount += numScore;
                    playerStats[p].historySum.push(lastSum + numScore);
                } else playerStats[p].historySum.push(lastSum);
            });
        });
        sortedPlayers = [...allData.players].sort((a, b) => playerStats[b].games - playerStats[a].games);
        if (Object.keys(chartLegendState).length === 0) sortedPlayers.forEach(p => { chartLegendState[p] = true; });
        renderHistory();
        renderChart(false); 
        sortLeaderboard(currentSortBy);
    }

    function formatMoney(num) {
        if(num == null || num === "") return "-";
        if(num > 0) return `<span class="win-text">+${num}</span>`;
        if(num < 0) return `<span class="lose-text">${num}</span>`;
        return `<span>0</span>`;
    }

    function renderHistory() {
        let thead = `<thead><tr><th style="width: 60px; min-width: 60px;">局數</th><th style="width: 110px; min-width: 110px;">日期</th>`;
        sortedPlayers.forEach(p => { thead += `<th>${p}</th>`; });
        thead += `<th style="min-width:120px;">備註</th></tr><tr><th colspan="2" class="text-end text-muted" style="color: var(--lime-green) !important;">累積金額 ➔</th>`;
        sortedPlayers.forEach(p => { thead += `<th>${formatMoney(playerStats[p].totalAmount)}</th>`; });
        thead += `<th>-</th></tr></thead>`;
        let tbody = `<tbody>`;
        let reverseRecords = [...allData.records].sort((a,b) => b.id - a.id);
        reverseRecords.forEach(r => {
            tbody += `<tr><td>${r.id}</td><td style="color: var(--text-muted) !important;">${r.date.substring(0,10)}</td>`;
            sortedPlayers.forEach(p => { tbody += `<td>${formatMoney(r.scores[p])}</td>`; });
            tbody += `<td style="color: var(--text-muted) !important;">${r.memo}</td></tr>`;
        });
        tbody += `</tbody>`;
        document.getElementById('historyTable').innerHTML = thead + tbody;
    }

    function sortLeaderboard(sortBy) {
        currentSortBy = sortBy;
        let rankPlayers = [...sortedPlayers].filter(p => playerStats[p].games > 0);
        rankPlayers.sort((a, b) => {
            let rateA = playerStats[a].wins / playerStats[a].games;
            let rateB = playerStats[b].wins / playerStats[b].games;
            if (sortBy === 'rate') {
                if (rateB !== rateA) return rateB - rateA;
                return playerStats[b].games - playerStats[a].games; 
            } else if (sortBy === 'amount') return playerStats[b].totalAmount - playerStats[a].totalAmount;
            else if (sortBy === 'games') return playerStats[b].games - playerStats[a].games;
            else if (sortBy === 'wins') return playerStats[b].wins - playerStats[a].wins;
            else if (sortBy === 'loses') return playerStats[b].loses - playerStats[a].loses;
        });
        let html = '';
        rankPlayers.forEach((p, index) => {
            let winRate = ((playerStats[p].wins / playerStats[p].games) * 100).toFixed(1);
            let medal = index === 0 ? "🥇 " : index === 1 ? "🥈 " : index === 2 ? "🥉 " : "";
            html += `<tr><td>${medal}${index + 1}</td><td class="fw-bold">${p}</td><td class="fw-bold" style="color: var(--lime-green)">${winRate}%</td><td>${formatMoney(playerStats[p].totalAmount)}</td><td>${playerStats[p].games}</td><td>${playerStats[p].wins}</td><td>${playerStats[p].loses}</td></tr>`;
        });
        document.getElementById('leaderboardTableBody').innerHTML = html;
    }

    function toggleChartMode() {
        is3DMode = !is3DMode;
        document.getElementById('toggleChartBtn').innerText = is3DMode ? "切換為 2D 視角" : "切換為 3D 視角";
        renderChart(false);
    }

    function renderChart(isPlayback = false) {
        let chartDom = document.getElementById('myChart');
        if(myChart) myChart.dispose(); 
        myChart = echarts.init(chartDom);
        if(animInterval) clearInterval(animInterval);
        
        let labels = ["起始"];
        let sortedRecords = [...allData.records].sort((a,b) => a.id - b.id);
        for(let i = 1; i <= sortedRecords.length; i++) labels.push(i);
        let totalSteps = labels.length;

        let activePlayers = sortedPlayers.filter(p => playerStats[p].games > 0);
        let intervalVal = document.getElementById('xAxisInterval').value;
        let axisInterval = intervalVal === 'auto' ? 'auto' : parseInt(intervalVal);
        
        // 【優化點2：平滑動畫引擎設定】
        let speed = Math.max(100, Math.min(300, 3000 / totalSteps)); // 計算最完美的播放過場速度
        
        // 【優化點1：Y軸比例強制6000倍數】
        // 數學邏輯：無條件進位/捨去至最近的6000
        let yAxisMinMaxRule = {
            max: function (value) { let t = Math.ceil(value.max / 6000) * 6000; return t === 0 ? 6000 : t; },
            min: function (value) { let t = Math.floor(value.min / 6000) * 6000; return t === 0 ? -6000 : t; }
        };

        let option = {
            backgroundColor: 'transparent',
            color: colorPalette,
            // 啟用線性過場動畫，讓線條順暢滑過去
            animation: true,
            animationDuration: isPlayback ? speed : 800,
            animationDurationUpdate: isPlayback ? speed : 800,
            animationEasing: 'linear',
            animationEasingUpdate: 'linear',
            tooltip: { backgroundColor: '#131B2F', borderColor: '#D9FF00', textStyle: { color: '#F8FAFC' } },
            legend: { data: activePlayers, selected: chartLegendState, textStyle: { color: '#94A3B8' }, top: 0 }
        };

        function getSeriesData(step) {
            if (!is3DMode) {
                option.tooltip.trigger = 'axis';
                option.grid = { left: '3%', right: '4%', bottom: '3%', containLabel: true };
                option.xAxis = { type: 'category', boundaryGap: false, data: labels, axisLabel: { color: '#94A3B8', interval: axisInterval }, axisLine: { lineStyle: { color: '#1E293B' } } };
                
                // 套用 Y軸 6000 的倍數級距與強制計算
                option.yAxis = { 
                    type: 'value', 
                    interval: 6000, 
                    max: yAxisMinMaxRule.max, 
                    min: yAxisMinMaxRule.min,
                    axisLabel: { color: '#94A3B8' }, 
                    splitLine: { lineStyle: { color: '#1E293B', type: 'dashed' } } 
                };
                
                return activePlayers.map((p, index) => {
                    return {
                        name: p, type: 'line', smooth: false, showSymbol: false,
                        lineStyle: { width: 3, shadowColor: colorPalette[index % colorPalette.length], shadowBlur: 10 },
                        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: colorPalette[index % colorPalette.length] }, { offset: 1, color: 'rgba(0,0,0,0)' }]), opacity: 0.1 },
                        data: playerStats[p].historySum.slice(0, step)
                    };
                });
            } else {
                option.grid3D = {
                    boxWidth: 200, boxDepth: 120, boxHeight: 80,
                    viewControl: { projection: 'perspective', autoRotate: true, autoRotateSpeed: 10, distance: 250 },
                    axisLine: { lineStyle: { color: '#94A3B8' } }, splitLine: { lineStyle: { color: '#1E293B' } }, axisPointer: { lineStyle: { color: '#D9FF00' } }
                };
                option.xAxis3D = { type: 'category', data: labels, name: '將數', nameTextStyle: { color: '#F8FAFC' }, axisLabel: { interval: axisInterval } };
                option.yAxis3D = { type: 'category', data: activePlayers, name: '玩家', nameTextStyle: { color: '#F8FAFC' } };
                
                // 3D Z軸同樣套用 6000 的倍數級距
                option.zAxis3D = { 
                    type: 'value', name: '金額', nameTextStyle: { color: '#F8FAFC' },
                    interval: 6000, max: yAxisMinMaxRule.max, min: yAxisMinMaxRule.min
                };
                
                return activePlayers.map((p, index) => {
                    let pData = playerStats[p].historySum.slice(0, step).map((amount, roundIndex) => {
                        return [labels[roundIndex], p, amount];
                    });
                    return {
                        name: p, type: 'line3D', data: pData,
                        lineStyle: { width: 4, color: colorPalette[index % colorPalette.length] },
                        itemStyle: { color: colorPalette[index % colorPalette.length] }
                    };
                });
            }
        }

        let playBtn = document.getElementById('playAnimBtn');

        if (isPlayback) {
            if(playBtn) { playBtn.disabled = true; playBtn.innerText = "⏳ 播放中..."; }
            let currentStep = 1; 
            option.series = getSeriesData(currentStep);
            myChart.setOption(option);
            
            animInterval = setInterval(() => {
                currentStep++;
                myChart.setOption({ series: getSeriesData(currentStep) });
                
                if(currentStep >= totalSteps) {
                    clearInterval(animInterval);
                    animInterval = null;
                    if(playBtn) { playBtn.disabled = false; playBtn.innerText = "▶️ 播放動畫"; }
                }
            }, speed);

        } else {
            option.series = getSeriesData(totalSteps);
            myChart.setOption(option);
            if(playBtn) { playBtn.disabled = false; playBtn.innerText = "▶️ 播放動畫"; }
        }

        myChart.on('legendselectchanged', function (params) {
            chartLegendState = params.selected;
        });
    }

    let loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
    let addRecordModal = new bootstrap.Modal(document.getElementById('addRecordModal'));
    function showLoginModal() { document.getElementById('loginAccount').value = ''; document.getElementById('loginPassword').value = ''; loginModal.show(); }
    
    async function doLogin() {
        let acc = document.getElementById('loginAccount').value;
        let pwd = document.getElementById('loginPassword').value;
        if(!acc) { alert("請輸入帳號"); return; }
        let btn = document.querySelector('#loginModal .btn-lime');
        btn.innerText = "驗證中..."; btn.disabled = true;
        try {
            let res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', account: acc, password: pwd }) });
            let result = await res.json();
            if(result.status === 'success') { loginModal.hide(); initAddRecordForm(); addRecordModal.show(); } else alert(result.message);
        } catch(e) { alert("連線錯誤"); }
        btn.innerText = "登入"; btn.disabled = false;
    }

    function initAddRecordForm() {
        document.getElementById('recordMemo').value = ''; document.getElementById('playerInputsContainer').innerHTML = '';
        document.getElementById('currentSum').innerText = '0'; document.getElementById('currentSum').style.color = "var(--lime-green)";
        for(let i=0; i<4; i++) addPlayerInputRow();
    }

    function addPlayerInputRow() {
        let container = document.getElementById('playerInputsContainer');
        let row = document.createElement('div');
        row.className = "row mb-2 align-items-center player-input-row";
        let selectHtml = `<select class="form-select player-select"><option value="">選擇玩家</option>`;
        availablePlayersForDropdown.forEach(p => { selectHtml += `<option value="${p}">${p}</option>`; });
        selectHtml += `<option value="NEW_PLAYER">++新增其他玩家++</option></select>`;
        row.innerHTML = `<div class="col-5">${selectHtml}</div><div class="col-5"><input type="number" class="form-control amount-input" placeholder="金額 (贏正輸負)" oninput="calcSum()"></div><div class="col-2"><button type="button" class="btn btn-outline-danger btn-sm w-100" onclick="this.parentElement.parentElement.remove(); calcSum();">✖</button></div>`;
        row.querySelector('.player-select').addEventListener('change', function() {
            if(this.value === 'NEW_PLAYER') {
                let newName = prompt("請輸入新玩家名稱：");
                if(newName && newName.trim() !== "") {
                    availablePlayersForDropdown.push(newName.trim());
                    let option = new Option(newName.trim(), newName.trim(), true, true);
                    this.add(option, this.options[this.options.length - 1]);
                } else this.value = "";
            }
        });
        container.appendChild(row);
    }

    function calcSum() {
        let sum = 0;
        document.querySelectorAll('.amount-input').forEach(input => { if(input.value !== "") sum += Number(input.value); });
        let sumEl = document.getElementById('currentSum');
        sumEl.innerText = sum; sumEl.style.color = sum === 0 ? "var(--lime-green)" : "var(--win-color)";
    }

    async function submitRecord() {
        let date = document.getElementById('recordDate').value;
        let memo = document.getElementById('recordMemo').value;
        let players = []; let rows = document.querySelectorAll('.player-input-row');
        let sum = 0, hasError = false;
        rows.forEach(row => {
            let name = row.querySelector('.player-select').value; let amount = row.querySelector('.amount-input').value;
            if(name && amount !== "") { players.push({ name: name, amount: Number(amount) }); sum += Number(amount); } 
            else if ((name && amount === "") || (!name && amount !== "")) hasError = true;
        });
        if(players.length === 0) { alert("請至少輸入一位玩家與金額！"); return; }
        if(hasError) { alert("有選玩家就必須輸入金額，反之亦然！"); return; }
        if(sum !== 0) { alert("防呆機制：金額總和必須為 0！ 目前總和為：" + sum); return; }

        let btn = document.querySelector('#addRecordModal .btn-lime');
        btn.innerText = "寫入雲端中..."; btn.disabled = true;
        try {
            let res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addRecord', date: date, memo: memo, players: players }) });
            let result = await res.json();
            if(result.status === 'success') { alert("對戰紀錄已寫入成功！"); addRecordModal.hide(); fetchData(); } 
            else alert(result.message);
        } catch(e) { alert("連線錯誤"); }
        btn.innerText = "確認送出"; btn.disabled = false;
    }
</script>
</body>
